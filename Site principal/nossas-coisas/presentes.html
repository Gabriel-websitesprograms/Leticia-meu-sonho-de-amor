    <style>
        .gift-photo-card {
            overflow: hidden;
            height: 100%;
            margin: 0;
            border: 1px solid rgba(120, 55, 79, 0.18);
            border-radius: 16px;
            background: #fffdfa;
            box-shadow: 0 8px 20px rgba(99, 59, 77, 0.16);
        }

        .gift-photo-card img {
            display: block;
            width: 100%;
            height: 18rem;
            object-fit: cover;
            object-position: center 62%;
        }

        .gift-photo-card figcaption {
            padding: 0.75rem;
            color: #633b4d;
            font-weight: 700;
        }

        .gift-list li:has(.gift-photo-card) {
            display: flex;
        }

        .gift-photo-card {
            width: 100%;
        }

        @media (max-width: 520px) {
            .gift-photo-card img {
                height: 22rem;
            }
        }
