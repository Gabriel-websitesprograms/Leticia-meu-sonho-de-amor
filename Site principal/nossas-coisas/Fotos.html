            position: absolute;

        .photos-page .photo-lightbox-panel::before {

        .photos-page .photo-lightbox-panel::after {

        .photo-viewer-topbar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            padding: 0.1rem 0.25rem 0.15rem;
        }

        .photo-viewer-kicker {
            grid-column: 2;
            margin: 0;
            color: #8c6a48;
            font: 700 clamp(0.62rem, 1.6vw, 0.76rem)/1.3 "Segoe UI", Arial, sans-serif;
            letter-spacing: 0.2em;

        }

        .photos-page .photo-lightbox-close {

        .photos-page .photo-lightbox.is-controls-visible .photo-lightbox-close,
        .photos-page .photo-lightbox-close:focus-visible {

        }

        .photo-viewer-stage {
            position: relative;
            display: grid;
            min-height: 0;
            place-items: center;
            overflow: hidden;
            isolation: isolate;
            border: 1px solid rgb(181 150 91 / 52%);
            border-radius: clamp(0.8rem, 2vw, 1.35rem);
            background: #211a1d;
            box-shadow: inset 0 0 0 5px rgb(255 255 255 / 5%);
        }

        .photo-viewer-stage::before {
            position: absolute;
            z-index: -1;
            inset: -2rem;
            background-image: var(--viewer-image);
            background-position: center;
            background-size: cover;
            content: "";
            filter: blur(24px) brightness(0.42) saturate(0.8);
            opacity: 0.72;
            transform: scale(1.08);
        }

        .photos-page .photo-lightbox-image {
            position: relative;
            z-index: 1;
            width: auto;
            height: auto;
            max-width: calc(100% - clamp(2.5rem, 9vw, 7rem));
            max-height: 100%;
            border: 1px solid rgb(255 255 255 / 75%);
            border-radius: 0.55rem;
            object-fit: contain;
            box-shadow: 0 14px 42px rgb(0 0 0 / 42%);
            will-change: transform, opacity, filter;
        }

        .photos-page .photo-lightbox-image.is-entering-next {
            animation: viewer-photo-next 560ms cubic-bezier(.2,.75,.2,1) both;
        }

        .photos-page .photo-lightbox-image.is-entering-previous {
            animation: viewer-photo-previous 560ms cubic-bezier(.2,.75,.2,1) both;
        }

        .photo-viewer-nav {
            position: absolute;
            z-index: 2;
            top: 50%;
            display: grid;
            width: clamp(2.65rem, 6vw, 3.5rem);
            height: clamp(2.65rem, 6vw, 3.5rem);
            place-items: center;
            padding: 0 0 0.18em;
            border: 1px solid rgb(255 255 255 / 64%);
            border-radius: 50%;
            background: rgb(255 253 249 / 88%);
            box-shadow: 0 6px 18px rgb(0 0 0 / 20%);
            color: #78374f;
            font: 2rem/1 Georgia, "Times New Roman", serif;
            cursor: pointer;
            transform: translateY(-50%);
            transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
        }

        .photo-viewer-nav:hover {
            background: #fff;
            box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
            transform: translateY(-50%) scale(1.08);
        }

        .photo-viewer-nav-previous { left: clamp(0.65rem, 2vw, 1.25rem); }
        .photo-viewer-nav-next { right: clamp(0.65rem, 2vw, 1.25rem); }

        .photo-viewer-footer {
            display: grid;
            grid-template-columns: 1fr minmax(5rem, 12rem) 1fr;
            align-items: center;
            gap: 0.65rem 1rem;
            min-width: 0;
            padding: 0.1rem 0.5rem 0.2rem;
        }

        .photo-viewer-caption {
            grid-column: 1 / -1;
            margin: 0;
            color: #523c3e;
            font: italic clamp(1rem, 2.2vw, 1.3rem)/1.35 Georgia, "Times New Roman", serif;
            text-align: center;
            text-wrap: balance;
        }

        .photo-viewer-count {
            color: #806451;
            font: 700 0.72rem/1 "Segoe UI", Arial, sans-serif;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.1em;
        }

        .photo-viewer-progress {
            width: 100%;
            height: 0.22rem;
            overflow: hidden;
            border: 0;
            border-radius: 999px;
            appearance: none;
            background: #e8ddd0;
        }

        .photo-viewer-progress::-webkit-progress-bar {
            border-radius: 999px;
            background: #e8ddd0;
        }

        .photo-viewer-progress::-webkit-progress-value {
            border-radius: 999px;
            background: linear-gradient(90deg, #d6bd8b, #9d526b);
            transition: width 420ms ease;
        }

        .photo-viewer-progress::-moz-progress-bar {
            border-radius: 999px;
            background: linear-gradient(90deg, #d6bd8b, #9d526b);
            transition: width 420ms ease;
        }

        .photos-page .photo-lightbox-image {
            width: auto;
            height: auto;
            max-width: calc(100vw - 3.25rem - env(safe-area-inset-left) - env(safe-area-inset-right));
            max-height: calc(100dvh - 3.25rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
            border: 0;
            border-radius: 0.45rem;
            object-fit: contain;
            object-position: center;
        }

        .photo-lightbox-close:hover,
        .photo-lightbox-close:focus-visible {
            background: #362a2b;
        }

        body.photos-page {
            min-height: 100vh;
            min-height: 100dvh;
            padding: 0;
            overflow: hidden;
            background: #171315;
            color: #fff;
        }

        .photos-page .menu-romantico {

        .photos-page.carousel-ui-visible .menu-romantico {
            opacity: 1;

        }

        .photos-page main {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: none;
            margin: 0;
        }

        .photos-page main > section,
        .photos-page .memory-carousel {
            width: 100%;
            height: 100%;
        }

        .photos-page .photos-intro,
        .photos-page .photos-footer,
        .photos-page .carousel-thumbnails {
            display: none;
        }

        .photos-page .memory-carousel {
            position: absolute;
            inset: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: #171315;
            box-shadow: none;
        }

        .photos-page .carousel-stage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            border: 0;
            border-radius: 0;
            background: #171315;
        }

        .photos-page .carousel-slide[hidden] {
            display: none;
        }

        .photos-page .carousel-slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            display: block;
            margin: 0;
        }

        .photos-page .carousel-open {
            position: absolute;
            inset: 0;
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            padding: 0;
            cursor: zoom-in;
        }

        .photos-page .carousel-open img {

            height: auto;

            padding: 0.55rem 1rem;

        @keyframes photo-slide-in {
            from {
                opacity: 0.25;
                filter: blur(5px);
                transform: translateX(var(--slide-offset, 3rem)) scale(0.985);

            0%, 100% { transform: scale(1); }
            12%, 28% { transform: scale(1.16); }
            20%, 36% { transform: scale(1); }

            .photos-intro,

                animation: none;

            .carousel-slide.is-sliding {

            .photos-intro::after {
                transform: translateX(-50%) scaleX(1);
            }
        }

            margin: 0.75rem auto 0;

            pointer-events: auto;
            transform: none;
        }

        .photos-page main {
            position: relative;
            inset: auto;
            width: min(100%, 68rem);
            height: auto;
            max-width: 68rem;
            margin: 0 auto;
        }

        .photos-page main > section {
            width: 100%;
            height: auto;
        }

        .photos-page .photos-intro,
        .photos-page .photos-footer {
            display: block;
        }

        .photos-page .photos-intro {
            margin: 1.6rem auto 1rem;
            text-align: center;
        }

        .photos-page .photos-intro h1 {
            color: #78374f;
        }

        .photos-page .photos-intro p {
            color: #705b61;
        }

        .photos-page .memory-carousel {
            display: none;
        }

        .photo-wall {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(0.9rem, 2.6vw, 1.8rem);
            width: min(100%, 64rem);
            height: min(96vh, 72rem);
            height: min(96dvh, 72rem);
            min-height: 44rem;
            margin: 0 auto;
            padding: clamp(0.65rem, 2vw, 1.15rem);
            overflow: hidden;
            border: 1px solid rgb(181 150 91 / 35%);
            border-radius: 1.5rem;
            background:
                linear-gradient(135deg, rgb(255 255 255 / 84%), rgb(252 240 241 / 75%)),
                #fbf7f3;
            box-shadow: 0 16px 42px rgb(61 41 50 / 11%);
            -webkit-mask-image: linear-gradient(to bottom, transparent, #000 2%, #000 98%, transparent);
            mask-image: linear-gradient(to bottom, transparent, #000 2%, #000 98%, transparent);
        }

        .photo-wall-column {
            min-width: 0;
            overflow: hidden;
        }

        .photo-wall-column:nth-child(2) {
            padding-top: 2.5rem;
        }

        .photo-wall-column:nth-child(3) {
            padding-top: 0.9rem;
        }

        .photo-wall-track,
        .photo-wall-sequence {
            display: flex;
            flex-direction: column;
            gap: clamp(0.7rem, 1.8vw, 1.1rem);
        }

        .photo-wall-track {
            gap: 0;
            will-change: transform;
            animation: photo-wall-rise var(--photo-wall-duration, 40s) linear infinite;
        }

        .photo-wall-column:nth-child(2) .photo-wall-track {
            --photo-wall-duration: 47s;
        }

        .photo-wall-column:nth-child(3) .photo-wall-track {
            --photo-wall-duration: 43s;
        }

        .photo-wall-sequence {
            flex: 0 0 auto;
            padding-bottom: clamp(0.75rem, 2vw, 1.25rem);
        }

        .photo-memory-card {
            display: block;
            width: 100%;
            padding: 0.42rem 0.42rem 0.25rem;
            overflow: hidden;
            border: 1px solid #e6d9c8;
            border-radius: 1rem;
            background: #fffdfa;
            box-shadow: 0 7px 18px rgb(61 41 50 / 12%);
            color: #78374f;
            cursor: zoom-in;
            text-align: left;
            transition: transform 220ms ease, box-shadow 220ms ease;
        }

        .photo-memory-card:hover,
        .photo-memory-card:focus-visible {
            z-index: 1;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgb(61 41 50 / 18%);
        }

        .photo-memory-card:focus-visible {
            outline: 2px solid #b5965b;
            outline-offset: 3px;
        }

        .photo-memory-card img {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 4.7;
            border-radius: 0.68rem 0.68rem 0.35rem 0.35rem;
            object-fit: cover;
        }

        .photo-memory-caption {
            display: flex;
            min-height: 2.15rem;
            align-items: center;
            justify-content: space-between;
            gap: 0.35rem;
            padding: 0.3rem 0.28rem 0.1rem;
            color: #5e444b;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(0.72rem, 1.8vw, 0.95rem);
            font-style: italic;
            line-height: 1.2;
        }

        .photo-memory-heart {
            flex: 0 0 auto;
            color: #a64e64;
            font-size: 1rem;
        }

        .photos-page .photos-footer {
            margin-top: 0.75rem;
            text-align: center;
        }

        .photos-page.photo-lightbox-open,
        .photos-page.photo-lightbox-open * {
            cursor: auto !important;
        }

        .photos-page.photo-lightbox-open .rose-cursor,
        .photos-page.photo-lightbox-open .rose-cursor-petal {
            display: none !important;
        }

        @keyframes viewer-backdrop-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes viewer-panel-in {
            from { opacity: 0; transform: translateY(1.25rem) scale(0.975); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes viewer-photo-next {
            from { opacity: 0; filter: blur(8px); transform: translateX(2.5rem) scale(0.97); }
            to { opacity: 1; filter: blur(0); transform: translateX(0) scale(1); }
        }

        @keyframes viewer-photo-previous {
            from { opacity: 0; filter: blur(8px); transform: translateX(-2.5rem) scale(0.97); }
            to { opacity: 1; filter: blur(0); transform: translateX(0) scale(1); }
        }

        @keyframes photo-wall-rise {
            to {
                transform: translateY(-50%);
            }
        }

        @media (max-width: 600px) {
            body.photos-page {
                padding-inline: 0.6rem;
            }

                margin: 1.25rem auto 0.8rem;

            }

            .photo-wall {

                padding-top: 1.5rem;
            }

            .photo-wall-column:nth-child(3) {
                padding-top: 0.55rem;
            }

            .photo-memory-card {

                border-radius: 0.72rem;
            }

            .photo-memory-card img {
                aspect-ratio: 4 / 5;
                border-radius: 0.48rem 0.48rem 0.25rem 0.25rem;
            }

            .photo-memory-caption {
                min-height: 1.7rem;
                padding-inline: 0.15rem;
                font-size: clamp(0.58rem, 2.5vw, 0.75rem);
            }

            .photo-memory-heart {
                font-size: 0.8rem;
            }

            .photos-page .photo-lightbox {
                padding: max(0.55rem, env(safe-area-inset-top)) 0.55rem max(0.55rem, env(safe-area-inset-bottom));
            }

            .photos-page .photo-lightbox-panel {
                width: 100%;
                height: min(94dvh, 58rem);
                gap: 0.55rem;
                padding: 0.65rem;
                border-radius: 1.15rem;
            }

            .photo-viewer-topbar {
                grid-template-columns: 1fr auto;
                gap: 0.35rem;
            }

            .photo-viewer-kicker {
                grid-column: 1;
                justify-self: start;
                padding-left: 0.25rem;
                font-size: 0.58rem;
                letter-spacing: 0.14em;
            }

            .photos-page .photo-lightbox-close {
                grid-column: 2;
                min-height: 2.25rem;
                padding: 0.45rem 0.7rem;
                font-size: 0.75rem;
            }

            .photos-page .photo-lightbox-image {
                max-width: calc(100% - 3.8rem);
                max-height: 100%;
            }

            .photo-viewer-nav {
                width: 2.35rem;
                height: 2.35rem;
                font-size: 1.55rem;
            }

            .photo-viewer-nav-previous { left: 0.35rem; }
            .photo-viewer-nav-next { right: 0.35rem; }

            .photo-viewer-footer {
                grid-template-columns: auto minmax(3rem, 1fr) auto;
                gap: 0.55rem;
                padding-inline: 0.2rem;
            }

            .photo-viewer-caption {
                font-size: 1rem;
            }

            .photo-viewer-count {
                font-size: 0.64rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .photo-wall {
                height: auto;
                min-height: 0;
                overflow: visible;
                -webkit-mask-image: none;
                mask-image: none;
            }

            .photo-wall-column {
                overflow: visible;
            }

            .photo-wall-track {
                animation: none;
            }

            .photo-wall-sequence:nth-child(2) {
                display: none;
            }

            .photo-memory-card {
                transition: none;
            }

            .photos-page .photo-lightbox,

            .photos-page .photo-lightbox-image.is-entering-next,
            .photos-page .photo-lightbox-image.is-entering-previous {

            }

            .photo-viewer-progress::-webkit-progress-value,
            .photo-viewer-progress::-moz-progress-bar,
            .photo-viewer-nav {
                transition: none;
            }
        }
    </style>

            <footer class="photo-viewer-footer">
                <p class="photo-viewer-caption" aria-live="polite"></p>
                <span class="photo-viewer-count" aria-label="Número da foto">01 / 17</span>
                <progress class="photo-viewer-progress" max="17" value="1" aria-label="Progresso das lembranças"></progress>
            </footer>
        </section>
    </div>
    <script>
        const lightbox = document.querySelector(".photo-lightbox");
        const lightboxImage = lightbox.querySelector(".photo-lightbox-image");
        const closeButton = lightbox.querySelector(".photo-lightbox-close");
        const viewerCaption = lightbox.querySelector(".photo-viewer-caption");
        const viewerCount = lightbox.querySelector(".photo-viewer-count");
        const viewerProgress = lightbox.querySelector(".photo-viewer-progress");
        const viewerStage = lightbox.querySelector(".photo-viewer-stage");
        const slides = [...document.querySelectorAll(".carousel-slide")];
        const thumbnails = [...document.querySelectorAll(".carousel-thumbnail")];
        const counter = document.querySelector(".carousel-count");
        const carousel = document.querySelector(".memory-carousel");
        const botaoApresentacao = document.querySelector("#alternar-apresentacao");
        let activeIndex = 0;
        let photoOpener;
        let temporizadorControles;
        let temporizadorSlide;
        let isPlaying = false;
        let pointerOverCarousel = false;
        let temporizadorInterface;
        let focoDoControleDeReproducao = false;
        let reproducaoSolicitadaPeloUsuario = false;

        const colunasMosaico = [...document.querySelectorAll(".photo-wall-column")];
        const imagensDoAlbum = slides.map((slide, index) => {
            const button = slide.querySelector(".carousel-open");
            const image = button.querySelector("img");
            const caption = slide.querySelector(".carousel-caption");
            return {
                index,
                src: image.getAttribute("src"),
                alt: image.alt,
                caption: caption.textContent.trim(),
                label: button.getAttribute("aria-label")
            };
        });

        const criarCartaoFoto = (foto, duplicado) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "photo-memory-card";
            button.setAttribute("aria-label", foto.label);
            button.dataset.photoIndex = String(foto.index);

            const image = document.createElement("img");
            image.src = foto.src;
            image.alt = duplicado ? "" : foto.alt;
            image.loading = "lazy";
            if (duplicado) {
                button.tabIndex = -1;
                button.setAttribute("aria-hidden", "true");
            }

            const caption = document.createElement("span");
            caption.className = "photo-memory-caption";
            caption.append(document.createTextNode(foto.caption));

            const heart = document.createElement("span");
            heart.className = "photo-memory-heart";
            heart.setAttribute("aria-hidden", "true");
            heart.textContent = "♥";
            caption.append(heart);
            button.append(image, caption);
            return button;
        };

        colunasMosaico.forEach((column, columnIndex) => {
            const track = document.createElement("div");
            track.className = "photo-wall-track";

            for (let copyIndex = 0; copyIndex < 2; copyIndex += 1) {
                const sequence = document.createElement("div");
                sequence.className = "photo-wall-sequence";
                sequence.setAttribute("aria-hidden", String(copyIndex > 0));

                imagensDoAlbum
                    .filter((_, index) => index % colunasMosaico.length === columnIndex)
                    .forEach((foto) => sequence.append(criarCartaoFoto(foto, copyIndex > 0)));

                track.append(sequence);
            }

            column.append(track);
        });

        const revelarInterfaceDoCarrossel = () => {
            document.body.classList.add("carousel-ui-visible");
            window.clearTimeout(temporizadorInterface);
            if (!window.matchMedia("(hover: none), (pointer: coarse)").matches) {
                temporizadorInterface = window.setTimeout(() => {
                    document.body.classList.remove("carousel-ui-visible");
                }, 1000);
            }
        };

        document.addEventListener("pointermove", revelarInterfaceDoCarrossel, { passive: true });
        document.addEventListener("pointerdown", revelarInterfaceDoCarrossel, { passive: true });
        document.addEventListener("keydown", revelarInterfaceDoCarrossel);

        const atualizarApresentacao = () => {
            window.clearTimeout(temporizadorSlide);
            botaoApresentacao.textContent = isPlaying
                ? "Pausar apresentação"
                : "Iniciar apresentação";
            botaoApresentacao.setAttribute("aria-pressed", String(isPlaying));

            if (
                !isPlaying
                || (
                    carousel.contains(document.activeElement)
                    && !focoDoControleDeReproducao
                    && !reproducaoSolicitadaPeloUsuario
                )
                || !lightbox.hidden
                || document.hidden
            ) {
                return;
            }

            temporizadorSlide = window.setTimeout(() => {
                showPhoto(activeIndex + 1);
                atualizarApresentacao();
            }, 2500);
        };

        const showPhoto = (index, direction) => {
            const nextIndex = (index + slides.length) % slides.length;
            if (nextIndex === activeIndex && slides[activeIndex] && !slides[activeIndex].hidden) return;

            if (direction === undefined) {
                const forwardDistance = (nextIndex - activeIndex + slides.length) % slides.length;
                const backwardDistance = (activeIndex - nextIndex + slides.length) % slides.length;
                direction = forwardDistance <= backwardDistance ? 1 : -1;
            }

            activeIndex = nextIndex;
            slides.forEach((slide, slideIndex) => {
                slide.hidden = slideIndex !== activeIndex;
                thumbnails[slideIndex].setAttribute(
                    "aria-current",
                    String(slideIndex === activeIndex)
                );
            });
            const activeSlide = slides[activeIndex];
            activeSlide.style.setProperty("--slide-offset", direction > 0 ? "3rem" : "-3rem");
            activeSlide.classList.remove("is-sliding");
            void activeSlide.offsetWidth;
            activeSlide.classList.add("is-sliding");
            counter.textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
            if (!lightbox.hidden) atualizarFotoAmpliada(direction);
            const faixaMiniaturas = thumbnails[activeIndex].parentElement;
            const deslocamentoMiniatura = thumbnails[activeIndex].offsetLeft - faixaMiniaturas.offsetLeft;
            faixaMiniaturas.scrollTo({
                left: Math.max(
                    0,
                    deslocamentoMiniatura - (faixaMiniaturas.clientWidth - thumbnails[activeIndex].clientWidth) / 2
                ),
                behavior: "smooth"
            });
        };

        const atualizarFotoAmpliada = (direction = 1) => {
            const activeSlide = slides[activeIndex];
            const image = activeSlide.querySelector("img");
            const caption = activeSlide.querySelector(".carousel-caption");
            lightboxImage.classList.remove("is-entering-next", "is-entering-previous");
            lightboxImage.src = image.src;
            lightboxImage.alt = image.alt;
            viewerCaption.textContent = caption.textContent.trim();
            viewerCount.textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}`;
            viewerProgress.max = slides.length;
            viewerProgress.value = activeIndex + 1;
            viewerProgress.setAttribute(
                "aria-label",
                `Lembrança ${activeIndex + 1} de ${slides.length}`
            );
            viewerStage.style.setProperty("--viewer-image", `url("${image.src}")`);
            void lightboxImage.offsetWidth;
            lightboxImage.classList.add(direction > 0 ? "is-entering-next" : "is-entering-previous");
        };

        const mostrarBotaoVoltar = () => {
            lightbox.classList.add("is-controls-visible");
            window.clearTimeout(temporizadorControles);
            if (!window.matchMedia("(hover: none), (pointer: coarse)").matches) {
                temporizadorControles = window.setTimeout(() => {
                    lightbox.classList.remove("is-controls-visible");
                }, 2200);
            }
        };

        const abrirFoto = (button) => {
            const photoIndex = Number(button.dataset.photoIndex);
            const slideIndex = slides.indexOf(button.closest(".carousel-slide"));
            if (Number.isInteger(photoIndex) && photoIndex >= 0 && photoIndex < slides.length) {
                showPhoto(photoIndex);
            } else if (slideIndex >= 0) {
                showPhoto(slideIndex);
            }
            photoOpener = button;
            lightbox.hidden = false;
            atualizarFotoAmpliada();
            mostrarBotaoVoltar();
            document.body.classList.add("photo-lightbox-open");
            atualizarApresentacao();
            closeButton.focus();
        };

        document.querySelector("#foto-anterior").addEventListener("click", () => {
            showPhoto(activeIndex - 1, -1);
            atualizarApresentacao();
        });

        document.querySelector("#proxima-foto").addEventListener("click", () => {
            showPhoto(activeIndex + 1, 1);
            atualizarApresentacao();
        });

        thumbnails.forEach((thumbnail, index) => {
            thumbnail.addEventListener("click", () => {
                showPhoto(index);
                atualizarApresentacao();
            });
        });

        botaoApresentacao.addEventListener("click", () => {
            isPlaying = !isPlaying;
            focoDoControleDeReproducao = isPlaying;
            reproducaoSolicitadaPeloUsuario = isPlaying;
            atualizarApresentacao();
        });

        carousel.addEventListener("pointerenter", () => {
            pointerOverCarousel = true;
            reproducaoSolicitadaPeloUsuario = false;
            atualizarApresentacao();
        });

        carousel.addEventListener("pointerleave", () => {
            pointerOverCarousel = false;
            reproducaoSolicitadaPeloUsuario = false;
            atualizarApresentacao();
        });

        carousel.addEventListener("focusin", () => {
            focoDoControleDeReproducao = false;
            reproducaoSolicitadaPeloUsuario = false;
            atualizarApresentacao();
        });

        carousel.addEventListener("focusout", () => {
            window.setTimeout(atualizarApresentacao, 0);
        });

        document.addEventListener("visibilitychange", atualizarApresentacao);

        const closeLightbox = () => {
            window.clearTimeout(temporizadorControles);
            lightbox.classList.remove("is-controls-visible");
            lightbox.hidden = true;
            document.body.classList.remove("photo-lightbox-open");
            lightboxImage.removeAttribute("src");
            if (photoOpener) photoOpener.focus();
            atualizarApresentacao();
        };

        document.querySelectorAll(".carousel-open").forEach((button) => {
            button.addEventListener("click", () => abrirFoto(button));
        });

        document.querySelector(".photo-wall").addEventListener("click", (event) => {
            const card = event.target.closest(".photo-memory-card");
            if (!card || !event.currentTarget.contains(card)) return;

            showPhoto(Number(card.dataset.photoIndex));
            abrirFoto(card);
        });

        closeButton.addEventListener("click", closeLightbox);
        lightbox.querySelector(".photo-viewer-nav-previous").addEventListener("click", () => {
            showPhoto(activeIndex - 1, -1);
            mostrarBotaoVoltar();
        });
        lightbox.querySelector(".photo-viewer-nav-next").addEventListener("click", () => {
            showPhoto(activeIndex + 1, 1);
            mostrarBotaoVoltar();
        });

        lightbox.addEventListener("pointermove", mostrarBotaoVoltar, { passive: true });
        lightbox.addEventListener("pointerdown", mostrarBotaoVoltar, { passive: true });

        lightbox.addEventListener("click", (event) => {
            if (event.target === lightbox) closeLightbox();
        });

        document.addEventListener("keydown", (event) => {
            if (lightbox.hidden) return;
            if (event.key === "Escape") {
                closeLightbox();
            } else if (event.key === "ArrowLeft") {
                event.preventDefault();
                showPhoto(activeIndex - 1, -1);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                showPhoto(activeIndex + 1, 1);
            }
        });

        let inicioToque;
        viewerStage.addEventListener("touchstart", (event) => {
            inicioToque = event.changedTouches[0].clientX;
        }, { passive: true });

        viewerStage.addEventListener("touchend", (event) => {
            if (inicioToque === undefined) return;
            const deslocamento = event.changedTouches[0].clientX - inicioToque;
            if (Math.abs(deslocamento) > 45) {
                const direction = deslocamento < 0 ? 1 : -1;
                showPhoto(activeIndex + direction, direction);
            }
            inicioToque = undefined;
        }, { passive: true });

        carousel.addEventListener("touchstart", (event) => {
            inicioToque = event.changedTouches[0].clientX;
        }, { passive: true });

        carousel.addEventListener("touchend", (event) => {
            if (inicioToque === undefined) return;
            const deslocamento = event.changedTouches[0].clientX - inicioToque;
            if (Math.abs(deslocamento) > 45) {
                const direction = deslocamento < 0 ? 1 : -1;
                showPhoto(activeIndex + direction, direction);
                atualizarApresentacao();
            }
            inicioToque = undefined;
        }, { passive: true });

        carousel.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                showPhoto(activeIndex - 1, -1);
                atualizarApresentacao();
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                showPhoto(activeIndex + 1, 1);
                atualizarApresentacao();
            }
        });

        revelarInterfaceDoCarrossel();
        showPhoto(0);
        atualizarApresentacao();
    </script>
    <script src="../../assets/js/brand-doodles.js" defer></script>
</body>
</html>
