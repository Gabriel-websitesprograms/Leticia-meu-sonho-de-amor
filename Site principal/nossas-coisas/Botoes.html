    <script>
        const fotosDoMenu = [...document.querySelectorAll(".menu-photo-carousel img")];
        const carrosselFotos = document.querySelector(".menu-photo-carousel");
        const quadroFotos = document.querySelector(".photo-frame");
        const contadorFotos = document.querySelector(".photo-frame-count");
        const legendaFoto = document.querySelector(".photo-frame-caption p");
        const pontosFotos = document.querySelector(".photo-carousel-dots");
        const progressoFotos = document.querySelector(".photo-frame-progress span");
        const botaoApresentacao = document.querySelector(".photo-carousel-play");
        const botaoFotoAnterior = document.querySelector(".photo-carousel-previous");
        const botaoProximaFoto = document.querySelector(".photo-carousel-next");
        const intervaloApresentacao = 4200;
        const embaralharFotos = (fotos) => {
            for (let index = fotos.length - 1; index > 0; index -= 1) {
                const randomIndex = Math.floor(Math.random() * (index + 1));
                [fotos[index], fotos[randomIndex]] = [fotos[randomIndex], fotos[index]];
            }
            return fotos;
        };
        let ordemDasFotos = embaralharFotos(fotosDoMenu);
        let fotoAtiva = 0;
        let apresentacaoAtiva = true;
        let temporizadorApresentacao;

        const atualizarApresentacaoFotos = () => {
            const foto = ordemDasFotos[fotoAtiva];
            const numeroFoto = String(fotoAtiva + 1).padStart(2, "0");
            const totalFotos = String(ordemDasFotos.length).padStart(2, "0");

            fotosDoMenu.forEach((imagem) => {
                const ativa = imagem === foto;
                imagem.classList.toggle("is-active", ativa);
                imagem.toggleAttribute("aria-hidden", !ativa);
            });
            [...pontosFotos.children].forEach((ponto, index) => {
                ponto.setAttribute("aria-current", String(index === fotoAtiva));
            });
            contadorFotos.textContent = `${numeroFoto} / ${totalFotos}`;
            legendaFoto.textContent = foto.alt;
            progressoFotos.style.width = `${((fotoAtiva + 1) / ordemDasFotos.length) * 100}%`;
            botaoApresentacao.setAttribute("aria-pressed", String(apresentacaoAtiva));
            botaoApresentacao.setAttribute(
                "aria-label",
                apresentacaoAtiva ? "Pausar apresentação" : "Iniciar apresentação"
            );
            botaoApresentacao.querySelector("span").textContent = apresentacaoAtiva
                ? "Pausar"
                : "Reproduzir";
            botaoApresentacao.firstChild.textContent = apresentacaoAtiva ? "Ⅱ " : "▶ ";
        };

        const pararTemporizadorApresentacao = () => {
            window.clearInterval(temporizadorApresentacao);
        };

        const iniciarTemporizadorApresentacao = () => {
            pararTemporizadorApresentacao();
            if (
                !apresentacaoAtiva
                || window.matchMedia("(prefers-reduced-motion: reduce)").matches
            ) {
                return;
            }
            temporizadorApresentacao = window.setInterval(() => {
                if (document.hidden || quadroFotos.hidden) return;
                mostrarFoto(fotoAtiva + 1);
            }, intervaloApresentacao);
        };

        const mostrarFoto = (index) => {
            fotoAtiva = (index + ordemDasFotos.length) % ordemDasFotos.length;
            atualizarApresentacaoFotos();
            iniciarTemporizadorApresentacao();
        };

        ordemDasFotos.forEach((_, index) => {
            const ponto = document.createElement("button");
            ponto.className = "photo-carousel-dot";
            ponto.type = "button";
            ponto.setAttribute("aria-label", `Mostrar foto ${index + 1}`);
            ponto.setAttribute("aria-current", String(index === fotoAtiva));
            ponto.addEventListener("click", () => mostrarFoto(index));
            pontosFotos.append(ponto);
        });

        botaoFotoAnterior.addEventListener("click", () => mostrarFoto(fotoAtiva - 1));
        botaoProximaFoto.addEventListener("click", () => mostrarFoto(fotoAtiva + 1));
        botaoApresentacao.addEventListener("click", () => {
            apresentacaoAtiva = !apresentacaoAtiva;
            atualizarApresentacaoFotos();
            iniciarTemporizadorApresentacao();
        });
        carrosselFotos.addEventListener("keydown", (event) => {
            if (event.key === "ArrowLeft") {
                event.preventDefault();
                mostrarFoto(fotoAtiva - 1);
            } else if (event.key === "ArrowRight") {
                event.preventDefault();
                mostrarFoto(fotoAtiva + 1);
            }
        });
        document.addEventListener("visibilitychange", iniciarTemporizadorApresentacao);
        atualizarApresentacaoFotos();
        iniciarTemporizadorApresentacao();
    </script>
    <script src="../../assets/js/brand-doodles.js" defer></script>
</body>
</html>
