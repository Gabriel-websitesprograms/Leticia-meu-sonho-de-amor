<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../assets/css/InterfaceProjeto-Leticia.css">
    <script src="../../assets/js/cursor-romantico.js" defer></script>
    <title>Músicas Dedicadas</title>
    <link rel="stylesheet" href="../../assets/css/menu-romantico.css">
    <script src="../../assets/js/menu-romantico.js" defer></script>
    <link rel="stylesheet" href="../../assets/css/brand-doodles.css">
    <link rel="stylesheet" href="../../assets/css/progresso-site.css">
    <script src="../../assets/js/progresso-site.js" defer></script>
    <link rel="stylesheet" href="../../assets/css/identidade-visual.css">
</head>
<body class="ornamento-lirios">
<nav class="menu-romantico" aria-label="Navegação desta seção">
    <span class="indicador" aria-hidden="true"></span>
    <div class="menu-item"><a href="Botoes.html" data-voltar>Voltar</a></div>
    <div class="menu-item">
        <a href="suasmusicasfavoritas.html">Músicas favoritas</a>
    </div>
</nav>
    <main>
        <section aria-labelledby="musicas-dedicadas">
            <h1 id="musicas-dedicadas">Músicas Dedicadas</h1>
            <p>Toque em cada caixa para descobrir os detalhes das músicas.</p>
            <ul class="music-list favorite-song-list">
                <li class="dedicated-song-card">
                    <h2>Me namora — Edu Ribeiro &amp; Banda Cativeiro</h2>
                    <div class="dedicated-playback-controls">
                        <button class="song-video-open dedicated-song-play" type="button" data-video-src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Me%20namora/Edu%20Ribeiro%20%26%20Banda%20Cativeiro%20-%20Me%20namora.mp4" aria-haspopup="dialog">▶ Tocar videoclipe</button>
                        <audio class="dedicated-audio-track" preload="metadata" aria-label="Faixa de áudio Me namora">
                            <source src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Me%20namora/Edu%20Ribeiro%20%26%20Banda%20Cativeiro%20-%20Me%20namora.mp3" type="audio/mpeg">
                        </audio>
                    </div>
                    <button class="song-lyrics-toggle" type="button" aria-expanded="false" aria-controls="letra-me-namora">Letra</button>
                    <iframe class="song-lyrics-file" id="letra-me-namora" src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Me%20namora/letra-Me-namora.txt" title="Letra de Me namora" hidden></iframe>
                </li>
                <li class="dedicated-song-card">
                    <h2>Superpowers — Daniel Caesar</h2>
                    <div class="dedicated-playback-controls">
                        <button class="song-video-open dedicated-song-play" type="button" data-video-src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Superpowers-Daniel%20Caesar/Daniel%20Caesar%20-%20Superpowers%20(Official%20Audio).mkv" aria-haspopup="dialog">▶ Tocar videoclipe</button>
                        <audio class="dedicated-audio-track" preload="metadata" aria-label="Faixa de áudio Superpowers">
                            <source src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Superpowers-Daniel%20Caesar/Daniel%20Caesar%20-%20Superpowers%20(Official%20Audio).mp3" type="audio/mpeg">
                        </audio>
                    </div>
                    <button class="song-lyrics-toggle" type="button" aria-expanded="false" aria-controls="letra-superpowers">Letra</button>
                    <iframe class="song-lyrics-file" id="letra-superpowers" src="../../Musicas%20dedicada%20a%20leticia%20no%20site/Superpowers-Daniel%20Caesar/letra-superpowers-Danielcaesar.txt" title="Letra de Superpowers" hidden></iframe>
                </li>
            </ul>
            <template id="additional-song-template">
                <li class="add-song-slot">
                    <h2></h2>
                    <audio class="selected-song-player" controls preload="metadata" hidden></audio>
                </li>
            </template>
        </section>
    </main>
    <script>
        const songList = document.querySelector(".favorite-song-list");
        const songTemplate = document.querySelector("#additional-song-template");

        for (let index = 1; index <= 13; index += 1) {
            const songSlot = songTemplate.content.firstElementChild.cloneNode(true);
            songSlot.querySelector("h2").textContent = `Música adicional ${index}`;
            songList.append(songSlot);
        }

        const overlay = document.createElement("div");
        const overlayPanel = document.createElement("section");
        const overlayClose = document.createElement("button");
        const overlayContent = document.createElement("div");
        const confettiContainer = document.createElement("div");
        const videoOverlay = document.createElement("div");
        const videoPanel = document.createElement("section");
        const videoClose = document.createElement("button");
        const videoTitle = document.createElement("h2");
        const videoPlayer = document.createElement("video");
        const videoStatus = document.createElement("p");
        let activeCard = null;
        let activeRevealButton = null;
        let previousFocus = null;
        let videoReturnFocus = null;
        let discoveryGeneration = 0;

        overlay.className = "song-discovery-overlay";
        overlay.hidden = true;
        overlay.setAttribute("aria-hidden", "true");
        overlayPanel.className = "song-discovery-panel";
        overlayPanel.setAttribute("role", "dialog");
        overlayPanel.setAttribute("aria-modal", "true");
        overlayPanel.setAttribute("aria-label", "Detalhes da música");
        confettiContainer.className = "song-confetti";
        confettiContainer.setAttribute("aria-hidden", "true");
        overlayClose.className = "song-discovery-close";
        overlayClose.type = "button";
        overlayClose.textContent = "×";
        overlayClose.setAttribute("aria-label", "Fechar detalhes da música");
        overlayContent.className = "song-discovery-content";
        overlayPanel.append(overlayClose, overlayContent);
        overlay.append(confettiContainer, overlayPanel);
        document.body.append(overlay);

        videoOverlay.className = "song-video-overlay";
        videoOverlay.hidden = true;
        videoOverlay.setAttribute("aria-hidden", "true");
        videoPanel.className = "song-video-panel";
        videoPanel.setAttribute("role", "dialog");
        videoPanel.setAttribute("aria-modal", "true");
        videoPanel.setAttribute("aria-labelledby", "song-video-title");
        videoClose.className = "song-discovery-close";
        videoClose.type = "button";
        videoClose.textContent = "×";
        videoClose.setAttribute("aria-label", "Fechar videoclipe");
        videoTitle.id = "song-video-title";
        videoTitle.textContent = "Videoclipe";
        videoPlayer.className = "song-video-overlay-player";
        videoPlayer.controls = true;
        videoPlayer.preload = "metadata";
        videoPlayer.loop = false;
        videoPlayer.playsInline = true;
        videoPlayer.setAttribute("playsinline", "");
        videoStatus.className = "song-video-status";
        videoStatus.setAttribute("role", "status");
        videoPanel.append(videoClose, videoTitle, videoPlayer, videoStatus);
        videoOverlay.append(videoPanel);
        document.body.append(videoOverlay);

        const closeVideo = (restoreFocus = true) => {
            if (videoOverlay.hidden) {
                return;
            }

            videoPlayer.pause();
            videoPlayer.removeAttribute("src");
            videoPlayer.replaceChildren();
            videoPlayer.load();
            videoStatus.textContent = "";
            videoOverlay.hidden = true;
            videoOverlay.setAttribute("aria-hidden", "true");
            document.body.classList.remove("song-video-open");
            if (restoreFocus) {
                videoReturnFocus?.focus();
            }
            videoReturnFocus = null;
        };

        const openVideo = (source, button) => {
            document.querySelectorAll("audio, video").forEach((player) => player.pause());
            videoReturnFocus = button;
            const songTitle = button.closest(".song-discovery-details, li").querySelector("h2").textContent;
            videoTitle.textContent = `Videoclipe: ${songTitle}`;
            videoPlayer.pause();
            videoPlayer.removeAttribute("src");
            videoPlayer.src = source;
            videoPlayer.load();
            videoOverlay.hidden = false;
            videoOverlay.setAttribute("aria-hidden", "false");
            document.body.classList.add("song-video-open");
            videoClose.focus();
            videoPlayer.play().catch((error) => {
                if (error.name !== "AbortError") {
                    videoStatus.textContent = "Não foi possível reproduzir este videoclipe neste navegador.";
                    console.error("Não foi possível reproduzir o videoclipe.", error);
                }
            });
        };

        videoPlayer.addEventListener("error", () => {
            videoStatus.textContent = "Não foi possível carregar este videoclipe. Verifique o formato do arquivo.";
        });
        videoClose.addEventListener("click", () => closeVideo());
        videoOverlay.addEventListener("click", (event) => {
            if (event.target === videoOverlay) {
                closeVideo();
            }
        });

        const launchConfetti = () => {
            const colors = ["#f2a7c0", "#e879a4", "#ffd2e0", "#d95e91", "#f7bfd1"];
            confettiContainer.replaceChildren();

            for (let index = 0; index < 42; index += 1) {
                const piece = document.createElement("span");
                const angle = (Math.PI * 2 * index) / 42 + Math.random() * 0.22;
                const distance = 120 + Math.random() * 260;
                piece.className = "song-confetti-piece";
                piece.style.setProperty("--confetti-x", `${Math.cos(angle) * distance}px`);
                piece.style.setProperty("--confetti-y", `${Math.sin(angle) * distance}px`);
                piece.style.setProperty("--confetti-rotation", `${Math.random() * 900 - 450}deg`);
                piece.style.setProperty("--confetti-delay", `${Math.random() * 120}ms`);
                piece.style.setProperty("--confetti-color", colors[index % colors.length]);
                confettiContainer.append(piece);
            }

            window.setTimeout(() => confettiContainer.replaceChildren(), 1800);
        };

        const animateDiscovery = (button) => {
            const generation = ++discoveryGeneration;
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                overlay.classList.add("is-open");
                launchConfetti();
                overlayClose.focus();
                return;
            }

            const buttonBounds = button.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const travelX = centerX - (buttonBounds.left + buttonBounds.width / 2);
            const travelY = centerY - (buttonBounds.top + buttonBounds.height / 2);
            const flyingButton = button.cloneNode(true);
            flyingButton.classList.add("song-reveal-flight");
            flyingButton.setAttribute("aria-hidden", "true");
            flyingButton.tabIndex = -1;
            flyingButton.style.left = `${buttonBounds.left}px`;
            flyingButton.style.top = `${buttonBounds.top}px`;
            flyingButton.style.width = `${buttonBounds.width}px`;
            flyingButton.style.height = `${buttonBounds.height}px`;
            document.body.append(flyingButton);

            const travel = flyingButton.animate([
                { transform: "translate(0, 0) scale(1) rotate(0deg)" },
                { transform: `translate(${travelX}px, ${travelY}px) scale(1.55) rotate(360deg)` }
            ], {
                duration: 650,
                easing: "cubic-bezier(.2,.8,.25,1)",
                fill: "forwards"
            });

            travel.finished.then(() => {
                if (generation !== discoveryGeneration) {
                    return;
                }

                const opening = flyingButton.animate([
                    { transform: `translate(${travelX}px, ${travelY}px) scale(1.55)`, opacity: 1 },
                    { transform: `translate(${travelX}px, ${travelY}px) scale(16)`, opacity: 0 }
                ], {
                    duration: 320,
                    easing: "cubic-bezier(.2,.8,.3,1)",
                    fill: "forwards"
                });

                return opening.finished;
            }).then(() => {
                if (generation !== discoveryGeneration) {
                    return;
                }

                flyingButton.remove();
                overlay.classList.remove("is-opening");
                overlay.classList.add("is-open");
                launchConfetti();
                overlayClose.focus();
            }).catch((error) => {
                flyingButton.remove();
                if (generation !== discoveryGeneration) {
                    return;
                }

                if (error.name !== "AbortError") {
                    console.error("Não foi possível concluir a animação de descoberta.", error);
                }
                overlay.classList.remove("is-opening");
                overlay.classList.add("is-open");
                launchConfetti();
                overlayClose.focus();
            });
        };

        const closeSong = () => {
        if (!activeCard) {
            return;
        }

        closeVideo(false);
        discoveryGeneration += 1;
        document.querySelector(".song-reveal-flight")?.getAnimations().forEach((animation) => animation.cancel());
        document.querySelector(".song-reveal-flight")?.remove();
        overlayContent.querySelectorAll("audio, video").forEach((player) => player.pause());
        activeCard.replaceChildren(activeRevealButton);
        overlay.hidden = true;
        overlay.setAttribute("aria-hidden", "true");
        overlay.classList.remove("is-open", "is-opening");
        confettiContainer.replaceChildren();
        document.body.classList.remove("song-discovery-open");
        activeCard = null;
        activeRevealButton = null;
        previousFocus?.focus();
        };

        overlayClose.addEventListener("click", closeSong);
        overlay.addEventListener("click", (event) => {
        if (event.target === overlay) {
            closeSong();
        }
        });
        document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            if (!videoOverlay.hidden) {
                closeVideo();
            } else if (!overlay.hidden) {
                closeSong();
            }
        }
        });

        const songCards = document.querySelectorAll(".favorite-song-list li");

        songCards.forEach((card, index) => {
        const isDedicatedSong = card.classList.contains("dedicated-song-card");
        const title = card.querySelector("h2");
        const player = card.querySelector("audio");
        const details = document.createElement("div");
        const revealButton = document.createElement("button");

        details.className = "song-discovery-details";
        details.append(...card.childNodes);
            revealButton.className = "song-reveal-button";
            revealButton.type = "button";
            revealButton.textContent = "?";
        revealButton.setAttribute("aria-label", `Descobrir música ${index + 1}`);
        card.replaceChildren(revealButton);

        revealButton.addEventListener("click", () => {
            if (activeCard) {
                closeSong();
            }

            activeCard = card;
            activeRevealButton = revealButton;
            previousFocus = revealButton;
            overlayPanel.setAttribute("aria-label", `Detalhes: ${title.textContent}`);
            overlayContent.replaceChildren(details);
            overlay.hidden = false;
            overlay.setAttribute("aria-hidden", "false");
            overlay.classList.remove("is-open");
            overlay.classList.add("is-opening");
            document.body.classList.add("song-discovery-open");
            animateDiscovery(revealButton);
        });

            const videoOpenButton = details.querySelector(".song-video-open");
            if (videoOpenButton) {
                videoOpenButton.addEventListener("click", () => {
                    openVideo(videoOpenButton.dataset.videoSrc, videoOpenButton);
                });
            }

            const controls = document.createElement("div");
            const playButton = document.createElement("button");
            const progress = document.createElement("input");
            const time = document.createElement("span");
            const playbackStatus = document.createElement("p");

            player.controls = false;
            player.loop = false;
            controls.className = "song-player-controls";
            playButton.className = "song-play-button";
            playButton.type = "button";
            playButton.textContent = "▶ Tocar";
            playButton.setAttribute("aria-label", `Tocar ${title.textContent}`);
            playButton.setAttribute("aria-pressed", "false");
            progress.className = "song-progress";
            progress.type = "range";
            progress.min = "0";
            progress.max = "1000";
            progress.value = "0";
            progress.setAttribute("aria-label", `Progresso de ${title.textContent}`);
            time.className = "song-time";
            time.textContent = "0:00 / 0:00";
            controls.append(playButton, progress, time);
            controls.hidden = !player.currentSrc;
            playbackStatus.className = "song-playback-status";
            playbackStatus.hidden = !player.currentSrc;
            playbackStatus.setAttribute("aria-live", "polite");
            player.insertAdjacentElement("afterend", controls);
            controls.insertAdjacentElement("afterend", playbackStatus);

            const formatTime = (seconds) => {
                if (!Number.isFinite(seconds)) {
                    return "0:00";
                }

                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
                return `${minutes}:${remainingSeconds}`;
            };

            const updateProgress = () => {
                const duration = player.duration || 0;
                progress.value = duration ? String(Math.round((player.currentTime / duration) * 1000)) : "0";
                time.textContent = `${formatTime(player.currentTime)} / ${formatTime(duration)}`;
            };

            playButton.addEventListener("click", () => {
                playbackStatus.textContent = "";
                if (player.paused) {
                    player.play().catch((error) => {
                        playbackStatus.textContent = "Não foi possível reproduzir esta música.";
                        console.error("Não foi possível reproduzir a música.", error);
                    });
                } else {
                    player.pause();
                }
            });

            progress.addEventListener("input", () => {
                if (Number.isFinite(player.duration)) {
                    player.currentTime = (Number(progress.value) / 1000) * player.duration;
                }
            });
            player.addEventListener("loadedmetadata", updateProgress);
            player.addEventListener("timeupdate", updateProgress);
            player.addEventListener("play", () => {
                document.querySelectorAll("audio, video").forEach((otherPlayer) => {
                    if (otherPlayer !== player) {
                        otherPlayer.pause();
                    }
                });
                playButton.textContent = "❚❚ Pausar";
                playButton.setAttribute("aria-label", `Pausar ${title.textContent}`);
                playButton.setAttribute("aria-pressed", "true");
            });
            player.addEventListener("pause", () => {
                playButton.textContent = "▶ Tocar";
                playButton.setAttribute("aria-label", `Tocar ${title.textContent}`);
                playButton.setAttribute("aria-pressed", "false");
            });
            player.addEventListener("ended", () => {
                player.currentTime = 0;
                updateProgress();
            });
            player.addEventListener("error", () => {
                playbackStatus.textContent = "Não foi possível carregar o arquivo de áudio desta música.";
            });

            if (isDedicatedSong) {
                const lyricsToggle = details.querySelector(".song-lyrics-toggle");
                const lyricsFrame = details.querySelector(".song-lyrics-file");

                const applyLyricsTheme = () => {
                    try {
                    const frameDocument = lyricsFrame.contentDocument;
                    if (!frameDocument || !frameDocument.body || !frameDocument.head) {
                        return;
                    }

                    frameDocument.head.querySelector("#song-lyrics-theme")?.remove();
                    const lyricStyle = frameDocument.createElement("style");
                    lyricStyle.id = "song-lyrics-theme";
                    lyricStyle.textContent = "html,body{min-height:100%;background:rgba(255,241,245,.82);color:#633b4d;font-family:Georgia,'Times New Roman',serif;font-size:1rem;line-height:1.8}body{margin:0;padding:1rem;white-space:pre-wrap}";
                    frameDocument.head.append(lyricStyle);
                } catch (error) {
                    console.warn("O navegador não permitiu aplicar o tema à letra incorporada.", error);
                }
            };

            lyricsFrame.addEventListener("load", applyLyricsTheme);
            applyLyricsTheme();
            lyricsToggle.addEventListener("click", () => {
                const isExpanded = lyricsToggle.getAttribute("aria-expanded") === "true";
                lyricsToggle.setAttribute("aria-expanded", String(!isExpanded));
                lyricsToggle.textContent = isExpanded ? "Letra" : "Ocultar letra";
                lyricsFrame.hidden = isExpanded;
            });
        } else {
            const lyricsId = `letra-musica-${index + 1}`;
            const lyricsKey = `letra-musica-favorita-${index + 1}`;
            const lyricsToggle = document.createElement("button");
            const lyricsSection = document.createElement("div");
            const lyricsLabel = document.createElement("label");
            const lyricsInput = document.createElement("textarea");
            const lyricsDisplay = document.createElement("p");

            lyricsToggle.className = "song-lyrics-toggle";
            lyricsToggle.type = "button";
            lyricsToggle.textContent = "Letra";
            lyricsToggle.setAttribute("aria-expanded", "false");
            lyricsToggle.setAttribute("aria-controls", lyricsId);
            lyricsSection.className = "song-lyrics";
            lyricsSection.hidden = true;
            lyricsLabel.htmlFor = lyricsId;
            lyricsLabel.textContent = "Letra da música";
            lyricsInput.id = lyricsId;
            lyricsInput.rows = 4;
            lyricsInput.placeholder = "Cole ou escreva a letra aqui.";
            lyricsDisplay.className = "song-lyrics-display";
            lyricsDisplay.setAttribute("aria-live", "polite");
            lyricsDisplay.hidden = true;
            lyricsSection.append(lyricsLabel, lyricsInput, lyricsDisplay);
            playbackStatus.insertAdjacentElement("afterend", lyricsToggle);
            lyricsToggle.insertAdjacentElement("afterend", lyricsSection);

            try {
                lyricsInput.value = localStorage.getItem(lyricsKey) || "";
            } catch (error) {
                console.error("Não foi possível carregar a letra salva.", error);
            }
            lyricsInput.addEventListener("input", () => {
                try {
                    localStorage.setItem(lyricsKey, lyricsInput.value);
                } catch (error) {
                    console.error("Não foi possível salvar a letra.", error);
                }
                if (!lyricsDisplay.hidden) {
                    lyricsDisplay.textContent = lyricsInput.value;
                }
            });

            lyricsToggle.addEventListener("click", () => {
                const isExpanded = lyricsToggle.getAttribute("aria-expanded") === "true";
                lyricsToggle.setAttribute("aria-expanded", String(!isExpanded));
                lyricsToggle.textContent = isExpanded ? "Letra" : "Ocultar letra";
                lyricsSection.hidden = isExpanded;
                if (!isExpanded) {
                    lyricsDisplay.textContent = lyricsInput.value || "Adicione a letra no campo acima para ela aparecer aqui.";
                    lyricsDisplay.hidden = false;
                }
            });

            player.addEventListener("play", () => {
                lyricsDisplay.textContent = lyricsInput.value || "Adicione a letra no campo acima para ela aparecer aqui.";
                lyricsDisplay.hidden = false;
                lyricsDisplay.classList.remove("lyrics-appear");
                void lyricsDisplay.offsetWidth;
                lyricsDisplay.classList.add("lyrics-appear");
            });

        }

        });
    </script>
    <script src="../../assets/js/brand-doodles.js" defer></script>
</body>
</html>
